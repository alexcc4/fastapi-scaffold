[project]
name = "fastapi-scaffold"
version = "0.1.0"
description = "Minimal FastAPI service scaffold"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.18.0",
    "bcrypt>=5.0.0",
    "cryptography>=46.0.0",
    "fastapi>=0.135.0",
    "greenlet>=3.3.0",
    "gunicorn>=26.0.0",
    "pydantic-settings>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.49",
    "typer>=0.27.0",
    "uvicorn>=0.44.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "integration: requires the configured test MySQL and Redis",
]
